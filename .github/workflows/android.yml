name: Compilar app Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RadarFutbol.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: "Radar Fútbol para Android"
          body: |
            Descarga **RadarFutbol.apk** desde tu celular Android e instálala.
            Versión compilada automáticamente desde el commit ${{ github.sha }}.
          files: RadarFutbol.apk
          make_latest: true

      - name: Guardar el log si falla
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "sin log" > /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Log de compilación fallida"
          git push -f origin build-logs
